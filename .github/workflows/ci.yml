# Type check, logic tests and web build on every change to the app or its help pages.
name: CI
on:
  push:
    branches: [main]
    paths: ["app/**", "docs/help/**", "demo-key/**", "tools/simulate.mjs", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["app/**", "docs/help/**", "demo-key/**", "tools/simulate.mjs", ".github/workflows/ci.yml"]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Generate the demo class the tests read (no slides needed)
        working-directory: .
        run: node tools/simulate.mjs --key demo-key --spec demo-key/demo.json --out demo
      - name: Type check
        run: npx tsc --noEmit
      - name: Logic tests (grading, hand-off, answer key, rescan, timing, help links)
        run: npm run test:logic
      - name: Web build
        run: npm run build
